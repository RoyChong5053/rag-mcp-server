server:
  host: "0.0.0.0"
  port: 8199

# Management dashboard + API. 0.0.0.0 = reachable by all LAN devices
# (development default; no TLS, so restrict host/firewall to trust the network).
admin:
  host: "0.0.0.0"
  port: 8198
  # Login gate (one-api style, optional). Empty username = disabled (legacy).
  # Set both to require Bearer login for all /api/* except health/info/login.
  # password_sha256 = hex(sha256(password)):  echo -n 's3cret' | sha256sum
  # Browser keeps the token (remember-me = localStorage 30d, else session tab).
  # username: "admin"
  # password_sha256: ""
  # session_days: 30

# Collection registry (management metadata). Lives next to the binary on m64.
registry_path: "collections.json"

# Runtime settings (search defaults edited via WebUI). Lives next to the binary.
settings_path: "settings.json"

# Append-only audit log tailed by the dashboard (MCP calls + tool usage).
audit_path: "logs/rag-mcp.log"
# Startup rotation: when the log exceeds this size it is shifted to .1/.2/...
# audit_max_mb: 20
# audit_keep: 3

# Data-bank root browsed by the dashboard (server-local paths).
docs_dir: "docs"

# Documents vault: the raw-text corpus. The vector side answers "what did I
# learn about X"; this side answers "where is that exact string".
#
# Every document is filed by machine under
#   <dir>/<yyyy-mm-dd>/<channel>/<category>/<HHMMSS>-<sha8>-<slug><ext>
# The date comes first so a date range is a list of directories, not a walk.
# Channels: web | agent | upload | chat | import. The category comes from the
# rule table below; a document that matches no rule lands in "_".
documents:
  # Empty = <docs_dir>/documents.
  dir: ""
  # Search engine: auto (ripgrep when the host has it, else the built-in
  # scanner), rg (insist on ripgrep), builtin (always the built-in scanner).
  # ripgrep is never bundled: it is a normal program, and the built-in
  # scanner is what keeps the feature independent of the host.
  search_backend: "auto"
  # An explicit ripgrep binary. Empty = look it up on PATH.
  rg_path: ""
  timeout_seconds: 60
  max_matches: 200
  per_file: 5
  # How far back the in-memory ledger index reaches. Older documents are
  # still found; a body that reappears after the window is filed as new.
  ledger_window_days: 30
  # Category rules. The first match wins. The subject is title + url + tags.
  categories: []
  #  - match: "^github\\.com|^gitlab\\.com"
  #    category: code
  #  - match: "^arxiv\\.org"
  #    category: paper
  #  - match: "^news\\.|^bbc\\.|^reuters\\."
  #    category: news

# Vector backend (vectra-only). backend is accepted for compatibility.
storage:
  backend: "vectra"
  vectra_dir: "Vectra"
  # memory_dir: "docs/memory"   # store_memory raw text (default: <docs_dir>/memory)


oneapi:
  base_url: "http://192.168.100.20:3000"
  backup_url: "http://192.168.10.2:3000"
  embed_model: "embedding"
  rerank_model: "reranker"
  api_key: ""
  provider_name: "one-api"
  vector_dim: 1024
  vector_distance: "Cosine"
  # embed_timeout_seconds is the INTERACTIVE budget (a recall has a user
  # waiting); bulk_embed_timeout_seconds is the BACKGROUND budget (index jobs,
  # web ingests), which sits above one-api's channel-failover window so a slow
  # channel is survived instead of aborting a document. 0 = 180.
  embed_timeout_seconds: 180
  bulk_embed_timeout_seconds: 180
  # How many background embedding requests may be in flight at once. The
  # interactive query path has its own slot. 0 = 2.
  bulk_concurrency: 2

chunking:
  chunk_size: 500
  overlap_percent: 30

rerank:
  enabled: true
  recall: 30
  # query_max_chars caps the query (runes, head kept) before embedding AND
  # reranking; 0 = unlimited. doc_max_chars caps each rerank document.
  query_max_chars: 500
  doc_max_chars: 1000

# Web search: pull live pages in and file them into the shared library.
#
# Provider keys are read from the environment variable named by api_key_env.
# Never put a real key in this file: it is tracked in git. Put the key in the
# server's secret file / service environment instead.
search:
  enabled: true
  # Collection the fetched pages are vectorized into. Keep it separate from
  # the personal-memory collection so web content never outranks your own facts.
  collection: "web_cache"
  # Ordered failover chain. The first provider that answers wins.
  providers:
    - deepseek
    - tavily
    - firecrawl
    - searxng
  count: 10
  # How many of the ranked results get fetched and vectorized. 0 = all of
  # them: whatever was searched goes into the collection.
  ingest_top_n: 0
  # Default age limit on search results: 0 = no limit. The web_search
  # argument freshness_days overrides it per call.
  freshness_days: 0
  # A recalled web page older than this is flagged as stale (it is still
  # returned — knowing something is old beats not knowing it exists).
  stale_after_days: 7
  # Cap on how much of a page body is stored.
  max_content_chars: 20000
  timeout_seconds: 45
  topic: "general"
  lang: ""
  tags:
    - web
  deepseek:
    base_url: "https://api.deepseek.com"
    api_key: ""
    api_key_env: "DEEPSEEK_API_KEY"
  tavily:
    base_url: "https://api.tavily.com"
    api_key: ""
    api_key_env: "TAVILY_API_KEY"
  firecrawl:
    base_url: "https://api.firecrawl.dev/v2"
    api_key: ""
    api_key_env: "FIRECRAWL_API_KEY"
    country: "MY"
  searxng:
    # Self-hosted instance; the json format must be enabled in its settings.yml.
    # The container is bound to loopback only (see deploy notes in README).
    base_url: "http://127.0.0.1:8899"
    language: ""
    categories: "general"
