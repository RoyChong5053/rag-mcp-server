server:
  host: "0.0.0.0"
  port: 8199

# Localhost-only management dashboard. Reach via: ssh -L 8198:localhost:8198 m64
admin:
  host: "127.0.0.1"
  port: 8198

# Collection registry (management metadata). Lives next to the binary on m64.
registry_path: "collections.json"

# Data-bank root browsed by the dashboard (server-local paths).
docs_dir: "docs"

qdrant:
  host: "localhost"
  port: 6333

oneapi:
  base_url: "http://192.168.100.20:3000"
  backup_url: "http://192.168.10.2:3000"
  embed_model: "embedding"
  rerank_model: "reranker"
  api_key: ""

chunking:
  chunk_size: 500
  overlap_percent: 30

rerank:
  enabled: true
  recall: 30
  query_max_chars: 2000
  doc_max_chars: 1000
