server:
  host: "0.0.0.0"
  port: 8199

# Management dashboard + API. 0.0.0.0 = reachable by all LAN devices
# (development default; no TLS, so restrict host/firewall to trust the network).
admin:
  host: "0.0.0.0"
  port: 8198

# Collection registry (management metadata). Lives next to the binary on m64.
registry_path: "collections.json"

# Runtime settings (search defaults edited via WebUI). Lives next to the binary.
settings_path: "settings.json"

# Append-only audit log tailed by the dashboard (MCP calls + tool usage).
# Relative to the config file's directory; survives reboot (unlike /tmp).
audit_path: "logs/rag-mcp.log"

# Data-bank root browsed by the dashboard (server-local paths).
# Prefer absolute on servers (ssh CWD is $HOME, not the app dir).
docs_dir: "docs"

# Documents vault: the raw-text corpus.
#
# Filed by machine under <dir>/<yyyy-mm-dd>/<channel>/<category>/, so the
# date comes first: a date range is then a list of directories instead of a
# walk over the whole corpus. The categories below are rules, not a taxonomy
# anybody has to maintain.
documents:
  # Empty = <docs_dir>/documents.
  dir: ""
  # auto = ripgrep when the host has it (m64 has rg 14.1.0), else the
  # built-in scanner. The built-in scanner is what keeps this independent
  # of the host.
  search_backend: "auto"
  rg_path: ""
  timeout_seconds: 60
  max_matches: 200
  per_file: 5
  ledger_window_days: 30
  categories:
    - match: "^github\\.com|^gitlab\\.com|^codeberg\\."
      category: code
    - match: "^arxiv\\.org|^doi\\.org"
      category: paper
    - match: "^news\\.|^bbc\\.|^reuters\\.|^apnews\\."
      category: news
    - match: "^docs\\.|^developer\\.|^readthedocs\\."
      category: docs

# Vector backend (vectra-only).
storage:
  backend: "vectra"
  vectra_dir: "Vectra"
  # memory_dir: "docs/memory"   # store_memory raw text (default: <docs_dir>/memory)


oneapi:
  base_url: "http://127.0.0.1:3000"
  backup_url: ""
  embed_model: "embedding"
  rerank_model: "reranker"
  # Fill in on the server after deploy; never commit real keys.
  # See config.local.yaml (gitignored) pattern.
  api_key: "REDACTED"
  provider_name: "one-api"
  vector_dim: 1024
  vector_distance: "Cosine"
  # Total per-call budget for one-api embed/rerank. Must stay above one-api's
  # own channel-failover window (EMBEDDING_TIMEOUT/RELAY_TIMEOUT x retries) so
  # one-api decides first; rag-mcp never cancels mid-failover. 0 = default 180.
  #
  # embed_timeout_seconds is the INTERACTIVE budget: a recall has a user
  # waiting, so it stays short and a slow channel costs a fast fail-open.
  embed_timeout_seconds: 65
  # bulk_embed_timeout_seconds is the BACKGROUND budget (index jobs, web
  # ingests): nobody waits, so a slow channel is survived instead of aborting
  # a whole document. It sits above one-api's 120s relay window on purpose.
  bulk_embed_timeout_seconds: 180
  rerank_timeout_seconds: 95
  # How many background embedding requests may be in flight at once. The
  # interactive query path has its own slot, so one-api sees at most this + 1
  # concurrent requests. 0 = 2.
  bulk_concurrency: 2
  # Whole-search wall-clock budget (embed + stores + rerank), checked only at
  # stage boundaries. Must stay below the caller's outer fail-safe
  # (TavernLab mcp_timeout 180) so the server answers first. 0 = default 170.
  search_budget_seconds: 170

chunking:
  chunk_size: 500
  overlap_percent: 30

rerank:
  enabled: true
  recall: 30
  # query_max_chars caps the query (runes, head kept) before embedding AND
  # reranking; 0 = unlimited. doc_max_chars caps each rerank document.
  query_max_chars: 500
  doc_max_chars: 1000

# Web search: pull live pages in and file them into the shared library.
#
# The API keys are read from the environment variable named by api_key_env.
# config.m64.yaml is tracked in git, so real keys never go in here: set them
# in the service environment (or export them before starting the server).
search:
  enabled: true
  collection: "web_cache"
  providers:
    - deepseek
    - tavily
    - firecrawl
    - searxng
  count: 10
  # 0 = every result: whatever was searched goes into the collection.
  ingest_top_n: 0
  # Default age limit on search results: 0 = no limit.
  freshness_days: 0
  # A recalled web page older than this is flagged as stale (still returned).
  stale_after_days: 7
  max_content_chars: 20000
  timeout_seconds: 45
  topic: "general"
  lang: ""
  tags:
    - web
  deepseek:
    base_url: "https://api.deepseek.com"
    api_key: ""
    api_key_env: "DEEPSEEK_API_KEY"
  tavily:
    base_url: "https://api.tavily.com"
    api_key: ""
    api_key_env: "TAVILY_API_KEY"
  firecrawl:
    base_url: "https://api.firecrawl.dev/v2"
    api_key: ""
    api_key_env: "FIRECRAWL_API_KEY"
    country: "MY"
  searxng:
    # Self-hosted instance bound to loopback; json format must be enabled in
    # its settings.yml.
    base_url: "http://127.0.0.1:8899"
    categories: "general"
